services:
  elaina-bot:
    build: .
    container_name: elaina-bot
    restart: unless-stopped
    stdin_open: true # needed for interactive terminal / pairing
    tty: true
    volumes:
      - ./config.js:/app/config.js
      - ./sessions:/app/sessions
      - ./data:/app/data
      - ./tmp:/app/tmp
    environment:
      - NODE_ENV=production
      - TZ=Asia/Jakarta
